name: masar
description: "Masar - Task Management App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  dartz: ^0.10.1
  get_it: ^7.7.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  connectivity_plus: ^6.1.0
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdfviewer: ^28.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/masar.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/icon/masar.png"

